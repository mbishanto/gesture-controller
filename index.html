<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Gesture Presentation Controller</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- MediaPipe -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      overflow:hidden;
      background:#050816;
      font-family:'Poppins',sans-serif;
      color:white;
    }

    .app{
      position:relative;
      width:100vw;
      height:100vh;
      overflow:hidden;
    }

    .app::after{

      content:"";

      position:absolute;
      inset:0;

      background:
      linear-gradient(
        to bottom,
        rgba(0,0,0,0.45),
        rgba(0,0,0,0.2)
      );

      z-index:1;
    }

    video,
    canvas{
      position:absolute;
      width:100%;
      height:100%;
      object-fit:cover;
      top:0;
      left:0;
    }

    #video{

      transform:scaleX(-1);

      filter:
      brightness(0.45)
      contrast(1.1)
      saturate(1.2)
      blur(1px);
    }

    .hero-title{

      position:absolute;

      top:50%;
      left:50%;

      transform:translate(-50%,-50%);

      font-size:90px;
      font-weight:800;

      letter-spacing:8px;

      color:rgba(255,255,255,0.08);

      z-index:2;

      pointer-events:none;

      text-align:center;
    }

    .hud{
      position:absolute;
      top:20px;
      left:20px;
      z-index:100;
      display:flex;
      flex-direction:column;
      gap:15px;
    }

    .card{
      backdrop-filter:blur(14px);
      background:rgba(255,255,255,0.08);
      border:1px solid rgba(255,255,255,0.15);
      border-radius:18px;
      padding:16px 22px;
      min-width:260px;
      box-shadow:
      0 10px 40px rgba(0,0,0,0.4);
    }

    .title{
      font-size:18px;
      font-weight:600;
      margin-bottom:8px;
      color:#67e8f9;
    }

    .status{
      font-size:15px;
      line-height:1.7;
    }

    .gesture{
      color:#00ffae;
      font-weight:600;
    }

    .bottom-bar{
      position:absolute;
      bottom:25px;
      left:50%;
      transform:translateX(-50%);
      z-index:100;
      display:flex;
      gap:14px;
      flex-wrap:wrap;
      justify-content:center;
      max-width:95%;
    }

    .gesture-box{
      padding:14px 18px;
      border-radius:16px;
      background:rgba(255,255,255,0.08);
      backdrop-filter:blur(10px);
      border:1px solid rgba(255,255,255,0.12);
      font-size:14px;
      transition:0.25s;
    }

    .gesture-box:hover{
      transform:translateY(-4px);
      background:rgba(255,255,255,0.12);
    }

    .live-dot{
      width:10px;
      height:10px;
      background:#00ff6a;
      border-radius:50%;
      display:inline-block;
      margin-right:8px;
      animation:pulse 1s infinite;
    }

    @keyframes pulse{
      0%{
        transform:scale(1);
        opacity:1;
      }

      50%{
        transform:scale(1.5);
        opacity:0.5;
      }

      100%{
        transform:scale(1);
        opacity:1;
      }
    }

    .top-right{
      position:absolute;
      top:20px;
      right:20px;
      z-index:100;
    }

    .fps{
      font-size:15px;
      font-weight:500;
      color:#00ffae;
    }

    .scan{
      position:absolute;
      inset:0;
      pointer-events:none;
      background:
      linear-gradient(
      to bottom,
      transparent 0%,
      rgba(0,255,170,0.05) 50%,
      transparent 100%
      );
      animation:scan 5s linear infinite;
      z-index:5;
    }

    @keyframes scan{
      0%{
        transform:translateY(-100%);
      }

      100%{
        transform:translateY(100%);
      }
    }

    .logo{
      font-size:22px;
      font-weight:700;
      color:white;
    }

    .logo span{
      color:#00ffae;
    }

    @media(max-width:768px){

      .hero-title{
        font-size:42px;
        letter-spacing:4px;
      }

    }

  </style>
</head>

<body>

<div class="app">

  <div class="hero-title">
    GESTURE AI SYSTEM
  </div>

  <video id="video" autoplay playsinline></video>
  <canvas id="canvas"></canvas>

  <div class="scan"></div>

  <div class="hud">

    <div class="card">
      <div class="logo">
        Gesture<span>AI</span>
      </div>
    </div>

    <div class="card">
      <div class="title">
        <span class="live-dot"></span>
        Live Detection
      </div>

      <div class="status">
        Gesture:
        <span class="gesture" id="gestureName">
          Detecting...
        </span>
        <br>

        Fingers:
        <span class="gesture" id="fingerCount">
          0
        </span>
      </div>
    </div>

  </div>

  <div class="top-right">
    <div class="card fps">
      FPS: <span id="fps">0</span>
    </div>
  </div>

  <div class="bottom-bar">

    <div class="gesture-box">
      ☝️ Draw
    </div>

    <div class="gesture-box">
      ✌️ Pointer
    </div>

    <div class="gesture-box">
      🤟 Undo
    </div>

    <div class="gesture-box">
      🖐️ Clear
    </div>

    <div class="gesture-box">
      ✊ Lock
    </div>

    <div class="gesture-box">
      👋 Swipe
    </div>

  </div>

</div>

<script>

const videoElement = document.getElementById("video");
const canvasElement = document.getElementById("canvas");
const canvasCtx = canvasElement.getContext("2d");

const gestureName = document.getElementById("gestureName");
const fingerCountText = document.getElementById("fingerCount");
const fpsText = document.getElementById("fps");

canvasElement.width = window.innerWidth;
canvasElement.height = window.innerHeight;

let lastFrame = performance.now();

function countFingers(landmarks){

  let count = 0;

  const tips = [8,12,16,20];
  const pips = [6,10,14,18];

  for(let i=0;i<tips.length;i++){

    if(landmarks[tips[i]].y < landmarks[pips[i]].y){
      count++;
    }
  }

  return count;
}

function getGesture(count){

  if(count === 1) return "DRAW";
  if(count === 2) return "POINTER";
  if(count === 3) return "UNDO";
  if(count === 4) return "CLEAR";

  return "IDLE";
}

function onResults(results){

  const now = performance.now();
  const fps = Math.round(1000 / (now - lastFrame));
  lastFrame = now;

  fpsText.innerText = fps;

  canvasCtx.save();

  canvasCtx.clearRect(
    0,
    0,
    canvasElement.width,
    canvasElement.height
  );

  canvasCtx.drawImage(
    results.image,
    0,
    0,
    canvasElement.width,
    canvasElement.height
  );

  if(results.multiHandLandmarks){

    for(const landmarks of results.multiHandLandmarks){

      drawConnectors(
        canvasCtx,
        landmarks,
        HAND_CONNECTIONS,
        {
          color:"#00FFAE",
          lineWidth:4
        }
      );

      drawLandmarks(
        canvasCtx,
        landmarks,
        {
          color:"#00E1FF",
          lineWidth:2
        }
      );

      const fingers = countFingers(landmarks);

      fingerCountText.innerText = fingers;

      const gesture = getGesture(fingers);

      gestureName.innerText = gesture;

      const x = landmarks[8].x * canvasElement.width;
      const y = landmarks[8].y * canvasElement.height;

      canvasCtx.beginPath();

      canvasCtx.arc(
        x,
        y,
        15,
        0,
        2 * Math.PI
      );

      canvasCtx.fillStyle = "#00ffae";
      canvasCtx.shadowColor = "#00ffae";
      canvasCtx.shadowBlur = 30;
      canvasCtx.fill();
      canvasCtx.shadowBlur = 0;
    }
  }

  canvasCtx.restore();
}

const hands = new Hands({

  locateFile:(file)=>{
    return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
  }

});

hands.setOptions({

  maxNumHands:1,
  modelComplexity:1,
  minDetectionConfidence:0.7,
  minTrackingConfidence:0.7

});

hands.onResults(onResults);

const camera = new Camera(videoElement, {

  onFrame:async ()=>{

    await hands.send({
      image:videoElement
    });

  },

  width:1280,
  height:720

});

camera.start();

</script>

</body>
</html>
